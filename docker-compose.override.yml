services:
  postgrest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI:?Set PGRST_DB_URI to the private Postgres URI}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-ascent}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Set PGRST_JWT_SECRET for the PostgREST bridge}
      PGRST_DB_AGGREGATES_ENABLED: "true"

  supabase-rest-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - postgrest
    volumes:
      - ./infra/local-rest/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Expose on host so local uvicorn (outside Docker) can reach PostgREST
    # Set SUPABASE_URL=http://localhost:54321 in backend/.env for local dev
    ports:
      - "54321:80"
