server {
  listen 80;
  server_name _;

  location /rest/v1/ {
    proxy_pass http://postgrest:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # PostgREST echoes the request query string in the Content-Location response
    # header. Large IN-clauses (hydrating many UUIDs at once) blow past nginx's
    # 4k default and produce "upstream sent too big header" -> 502.
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;
  }

  location = / {
    return 200 'supabase-rest-proxy';
    add_header Content-Type text/plain;
  }
}
