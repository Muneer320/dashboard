[project]
name = "ascent-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for Ascent Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.135.3",
    "fastapi-cache2>=0.2.2",
    "google-api-python-client>=2.187.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.2.3",
    "greenlet<3.4",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.24",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "supabase>=2.28.3",
    "uvicorn[standard]>=0.44.0",
]

[project.scripts]
ascent-api = "app.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23,<1",
]
