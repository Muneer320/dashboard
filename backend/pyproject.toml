[project]
name = "ascent-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for Ascent Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.135.3",
    "greenlet<3.4",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.24",
    "sqlalchemy>=2.0.49",
    "supabase>=2.28.3",
    "uvicorn[standard]>=0.44.0",
]

[project.scripts]
ascent-api = "app.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
